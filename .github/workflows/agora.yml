name: Atualizar secção Agora

on:
  schedule:
    - cron: "17 6 * * *"   # todos os dias às 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agora:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar README
        run: python3 scripts/agora.py "${{ github.repository_owner }}" README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit se mudou
        run: |
          if git diff --quiet; then echo "Nada a fazer"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "Atualiza secção Agora"
          git push
